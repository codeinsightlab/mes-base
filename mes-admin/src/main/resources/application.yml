spring:
  application:
    name: mes-base
  profiles:
    default: dev
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
    resources:
      add-mappings: false
  jackson:
    time-zone: Asia/Shanghai
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      filters: stat,wall
      initial-size: 5
      min-idle: 10
      max-active: 20
      max-wait: 60000
      connect-timeout: 30000
      socket-timeout: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  data:
    redis:
      timeout: 5s
  quartz:
    properties:
      org:
        quartz:
          threadPool:
            threadCount: 2
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

mes:
  logging:
    http:
      # 普通 HTTP 请求达到该耗时（毫秒）后以 WARN 记录完成摘要。
      slow-threshold-ms: 1000
  http:
    logging:
      # 仅排除完成摘要，不跳过 requestId、安全检查或异常日志。空字符串表示不排除。
      exclude-paths: /health,/actuator/health/**,/favicon.ico,/assets/**,/static/**,/openapi-docs/**
  storage:
    type: local
  system:
    enabled: false
    # Blank derives an isolated namespace from the trusted Platform JDBC identity.
    cache-namespace: ""
  platform:
    enabled: false
    migrate: false
    max-upload-bytes: 10000000
  runtime:
    enabled: false
  business:
    cache:
      # 所有业务数据缓存的统一有效期（秒）。
      ttl-seconds: 300
  codegen:
    # Developer metadata profile is independent of Factory Runtime bindings.
    default-datasource: dev

  datasource:
    # 每条工厂/数据源绑定缓存独立过期，命中不续期。
    metadata-ttl-seconds: 300

# Source Product infrastructure settings shared by the direct dev/prod YAML files.
ruoyi:
  captcha:
    enabled: true
    type: char
    width: 160
    height: 60
    font-size: 36
    length: 4
    expiration-minutes: 2

token:
  expire-time: 240
user:
  password:
    min-length: 12
    max-length: 128
    max-retry-count: 5
    lock-time: 10
xss:
  enabled: true
  url-patterns: /api/system/*,/api/monitor/*,/api/personal/*,/api/common/*
  excludes: /api/personal/profile/updatePwd
# Source Minio configuration keys; values supplied by the deployment owner.
minio:
  url: ""
  access-key: ""
  secret-key: ""
  bucket-name: ""

# Source Swagger PORT: disable the SDK's unclassified MVC endpoints and public UI.
# The application exposes only its own tool:swagger:view endpoint; UI lives in Base UI.
springdoc:
  enable-default-api-docs: false
  swagger-ui:
    enabled: false
  paths-to-match: /api/**,/health,/open-api/**
  packages-to-scan: dev.mesbase.web.controller,dev.mesbase.quartz.controller,dev.mesbase.server,dev.mesbase.framework.openapi

# External client management and dedicated authentication; independent of internal user sessions.
open-api:
  enabled: true
  namespace: base
  token-ttl-seconds: 7200
  rate-window-seconds: 60
  token-rate-limit: 20
  api-rate-limit: 120
  data-scope:
    enabled: false
