spring:
  application:
    name: mes-base
  profiles:
    default: dev
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never
    resources:
      add-mappings: false
  jackson:
    time-zone: Asia/Shanghai
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      filters: stat,wall
      initial-size: 0
      min-idle: 0
      max-active: 5
      max-wait: 5000
      connect-timeout: 5000
      socket-timeout: 30000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
  data:
    redis:
      timeout: 5s
  quartz:
    properties:
      org:
        quartz:
          threadPool:
            threadCount: 2
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

mes:
  storage:
    type: local
  system:
    enabled: false
    # Blank derives an isolated namespace from the trusted Platform JDBC identity.
    cache-namespace: ""
  platform:
    enabled: false
    migrate: false
    max-upload-bytes: 10000000
  runtime:
    enabled: false
  codegen:
    # Developer metadata profile is independent of Factory Runtime bindings.
    default-datasource: dev

# Source Product infrastructure settings shared by the direct dev/prod YAML files.
ruoyi:
  name: MES Base
  version: 0.1.0
  captcha:
    enabled: true
    type: char
    width: 160
    height: 60
    font-size: 36
    length: 4
    expiration-minutes: 2

token:
  expire-time: 60
user:
  password:
    min-length: 12
    max-length: 128
    max-retry-count: 5
    lock-time: 10
xss:
  enabled: true
  url-patterns: /api/system/*,/api/monitor/*,/api/personal/*,/api/common/*
  excludes: /api/personal/profile/updatePwd
# Source Minio configuration keys; values supplied by the deployment owner.
minio:
  url: ""
  access-key: ""
  secret-key: ""
  bucket-name: ""

# Source Swagger PORT: disable the SDK's unclassified MVC endpoints and public UI.
# The application exposes only its own tool:swagger:view endpoint; UI lives in Base UI.
springdoc:
  enable-default-api-docs: false
  swagger-ui:
    enabled: false
  paths-to-match: /api/**,/health,/open-api/**
  packages-to-scan: dev.mesbase.web.controller,dev.mesbase.quartz.controller,dev.mesbase.server

# Optional infrastructure only. Package with -Popenapi and explicitly enable at runtime.
open-api:
  enabled: false
