name: Verify Base
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - run: python3 scripts/check-private-config.py
      - run: mvn -B -ntp verify
      - run: python3 scripts/smoke-packaged.py
