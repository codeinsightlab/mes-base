# Copy to mes-admin/src/main/resources/application-dev.yml and fill actual server/password values directly.
mes:
  platform:
    enabled: true
    migrate: false
    url: "jdbc:mysql://127.0.0.1:3306/mes_base_dev?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: mes_base_dev
    password: ""
    file-root: .local/files
  system:
    enabled: true
  runtime:
    # 32-byte Base64 AES key. Actual private dev/prod profiles already contain independently generated keys.
    datasource-key: ""
    enabled: true
  codegen:
    default-datasource: dev
    profiles:
      dev:
        url: "jdbc:mysql://127.0.0.1:3306/mes_base_dev_business?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
        username: mes_base_dev
        password: ""
spring:
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      password: ""
      database: 1

server:
  address: 127.0.0.1
  port: 18081
user:
  password: ""
ruoyi:
  profile: .local/files
  captcha:
    enabled: false
logging:
  level:
    root: INFO
