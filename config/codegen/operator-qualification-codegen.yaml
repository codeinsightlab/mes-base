# 用户全工序资格基础后端生成；连接由本地配置显式提供，本次使用隔离 H2 metadata。
# 尚无已确认的外部匹配键及主子表同步契约，本轮关闭同步生成。
version: 1
generateSync: false
sync:
  matchKey: "code"
  batchMaximum: 1000
source:
  connectionConfig: ".local/operator-qualification-codegen.yml"
  datasource: "acceptance"
  schema: null
selection:
  tables: [mes_operator_qualification]
  excludeTables: [flyway_business_schema_history, qc_index, qc_defect]
  artifacts: [persistence, backend, test]
naming:
  module:
    strategy: "table-prefix"
    separator: "_"
    fallback: "business"
  className:
    strategy: "table-pascal-case"
  displayName:
    strategy: "table-comment"
    fallback: "table-name"
  author: "MES Base"
output:
  backendRoot: "."
  backendModule: "mes-business"
  frontendRoot: "../mes-base-ui"
  javaPackage: "dev.mesbase.business.{module}"
  packages:
    domain: "domain"
    mapper: "dao"
    service: "service"
    serviceImplementation: "service.impl"
    controller: "controller"
    response: "controller.vo"
  frontendApi: "src/api/{module}/{classNameCamel}.ts"
  frontendPage: "src/views/{module}/{classNameCamel}/index.vue"
  frontendMenu: "src/menus/{module}/{classNameCamel}.json"
  menuSql: "docs/generated/{module}/{classNameCamel}-menu.sql"
  documents:
    mode: "merged"
    sql: "docs/generated/production/operator-assignment-menu.sql"
    markdown: "docs/generated/production/operator-assignment-permissions.md"
templates:
  root: "mes-generator/src/main/resources/codegen/base"
  persistence: "mybatis3-xmlmapper"
backend:
  apiPath: "/api/{module}/{tableNameKebab}"
  transactionManager: "businessTransactionManager"
  conditional:
    enabled: true
    property: "mes.business.enabled"
    value: "true"
  permission:
    prefix: "business"
    resource: "{tableNameColon}"
    scope: "factory"
    actions: [list, query, create, update, delete]
    batchDeleteAction: "delete"
fields:
  audit: [create_by, create_time, update_by, update_time]
  maxStringValidationLength: 10000
limits:
  pageDefault: 20
  pageMaximum: 100
  batchDeleteMaximum: 100
frontend:
  crudComponent: "@/components/CrudPage.vue"
  requestModule: "@/lib/request"
  fieldTypesModule: "@/lib/crud"
menu:
  table: "sys_menu"
  parentId: 0
  directoryName: "生产基础"
  directoryPath: "production"
  directoryOrder: 0
  pageOrder: 0
  icon: "list"
  frontendIcon: "List"
  createdBy: "codegen"
  migrateLegacyPermissions: false
execution:
  mode: "write"
  overwrite: "fail"
  formatJava: false
  formatter: "scripts/format-java"
  publication: "preflight-all"
  unsupportedTable: "fail"
tableOverrides:
  mes_operator_qualification:
    module: production
    displayName: 用户工序资格
