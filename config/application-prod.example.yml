# Copy to mes-admin/src/main/resources/application-prod.yml and fill actual server/password values directly.
# Separate databases/accounts; this is not a production deployment.
mes:
  platform:
    enabled: true
    migrate: false
    url: "jdbc:mysql://127.0.0.1:3306/mes_base_prod?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: mes_base_prod
    password: ""
    file-root: .local/prod-files
  system:
    enabled: true
  runtime:
    # 32-byte Base64 AES key. Actual private dev/prod profiles already contain independently generated keys.
    datasource-key: ""
    enabled: true
  codegen:
    default-datasource: prod
    profiles:
      prod:
        url: "jdbc:mysql://127.0.0.1:3306/mes_base_prod_business?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
        username: mes_base_prod
        password: ""
spring:
  data:
    redis:
      host: 127.0.0.1
      port: 16379
      password: ""
      database: 2

server:
  address: 127.0.0.1
  port: 8080
user:
  password: ""
ruoyi:
  profile: .local/prod-files
  captcha:
    enabled: true
logging:
  level:
    root: INFO
