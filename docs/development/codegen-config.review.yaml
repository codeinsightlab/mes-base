# 项目配置：由 scripts/mes-business-codegen 读取，旧 scripts/mes-codegen 不读取此格式。
# 本文件显式记录 MES Base 项目取值；生成器不得内置这些项目默认值。
# 不包含数据库凭证，不执行菜单 SQL，不授予角色。
version: 1

# 默认 false；历史配置缺少此项也按 false。当前用户要求本次全量覆盖时生成同步，因此显式开启。
generateSync: true
sync:
  # 物理列名，不猜业务字段；每表可用 tableOverrides.<table>.syncMatchKey 覆盖。
  # primary-key 是显式选择 metadata 主键的技术策略，接 ERP 前须确认其来源标识映射；不会自动采用。
  matchKey: "code"
  batchMaximum: 1000

source:
  # 引用已有开发连接配置中的 profile，不等于运行时工厂或数据库名称。
  connectionConfig: "mes-admin/src/main/resources/application-dev.yml"
  datasource: "dev"
  # null 表示不指定 schema，使用连接所选数据库的 metadata 范围。
  schema: null

selection:
  # [] 表示全部表；[pro_workorder] 表示只生成这张表。
  # [pro_workorder, person] 表示只生成列出的表。
  tables: [material_category, unit_measure, workstation, workshop, material, safety_stock]
  # 全量生成时明确跳过的表；默认草案为空，不猜测哪些属于业务表。
  # 排除 Flyway 迁移历史技术表，防止生成其 CRUD/同步接口。
  excludeTables: [flyway_business_schema_history]
  # 与表选择独立：all 表示所有产物；也可指定 persistence/backend/frontend/menu/test。
  artifacts: [all]

naming:
  # 功能模块：决定 API 分组及前端目录，不是 Maven 模块或数据库名称。
  # 例如 pro_workorder -> pro；person -> business。
  module:
    strategy: "table-prefix"
    separator: "_"
    # 无分隔符时使用的模块/包段，可修改；本项目约定值为 business。
    # person -> dev.mesbase.modules.business；改为 common 后包段为 common。
    # 此值应由配置提供，未来实现不能在生成器中暗藏 business 默认值。
    fallback: "business"
  # 表名按下划线转 PascalCase：pro_workorder -> ProWorkorder。
  # 类名和字段名由技术命名规则转换，不逐个强制手工输入。
  className:
    strategy: "table-pascal-case"
  # 页面显示名来自表注释；没有注释时明确采用完整表名。
  displayName:
    strategy: "table-comment"
    fallback: "table-name"
  author: "MES Base"

output:
  # 路径相对于后端仓库根解析，不相对于当前 shell 目录。
  backendRoot: "."
  backendModule: "mes-business"
  frontendRoot: "../mes-base-ui"
  # {module} 等占位符是配置插值，不是生成器内置 MES 包规则。
  javaPackage: "dev.mesbase.business.{module}"
  packages:
    domain: "domain"
    mapper: "dao"
    service: "service"
    serviceImplementation: "service.impl"
    controller: "controller"
    response: "controller.vo"
  frontendApi: "src/api/{module}/{classNameCamel}.ts"
  frontendPage: "src/views/{module}/{classNameCamel}/index.vue"
  frontendMenu: "src/menus/{module}/{classNameCamel}.json"
  menuSql: "docs/generated/{module}/{classNameCamel}-menu.sql"

templates:
  # 当前项目模板位置；未来换项目显式换模板包和其中的依赖引用。
  root: "mes-admin/src/main/resources/codegen/base"
  # MBG 持久化输出机制，仍是生成器自身的技术能力。
  persistence: "mybatis3-xmlmapper"

backend:
  apiPath: "/api/{module}/{tableNameKebab}"
  transactionManager: "businessTransactionManager"
  conditional:
    # false 表示不生成条件注解；此时 property/value 显式为 null。
    enabled: true
    property: "mes.business.enabled"
    value: "true"
  permission:
    # 不从 backendModule 自动推断，也不关联物理数据库名。
    prefix: "business"
    resource: "{tableNameColon}"
    scope: "factory"
    actions: [list, query, create, update, delete]
    # 单删、批删均使用 delete 权限。
    batchDeleteAction: "delete"

fields:
  # 先显式保留现行工程约定，是否需要这些审计字段规则可继续讨论。
  audit: [create_by, create_time, update_by, update_time]
  maxStringValidationLength: 10000
  # 不设置字段名业务黑名单，不自动推断人员、资源或工厂业务。

limits:
  pageDefault: 20
  pageMaximum: 100
  batchDeleteMaximum: 100

frontend:
  crudComponent: "@/components/CrudPage.vue"
  requestModule: "@/lib/request"
  fieldTypesModule: "@/lib/crud"

menu:
  table: "sys_menu"
  parentId: 0
  directoryName: "基础数据"
  directoryOrder: 0
  pageOrder: 0
  icon: "list"
  frontendIcon: "List"
  createdBy: "codegen"
  # 是否需要生成旧权限名迁移 UPDATE，明确关闭而非默认猜测历史。
  migrateLegacyPermissions: false

execution:
  # dry-run：读取表结构、生成内容并预检目标文件，不写入生成代码；仍会写调用时指定的 JSON 报告。
  # write：全部预检通过后才写入生成文件；生成的菜单 SQL 仍需人工审查、另行执行。
  # 注意：dry-run 同样检查覆盖策略，已有文件内容不同也会报 FAILED_PREFLIGHT / OUTPUT_CONFLICT。
  mode: "write"
  # fail：新文件允许生成；已有文件内容完全相同则保留；内容不同则拒绝本轮发布。
  # replace-generated：仅当已有文件和新内容都带 MES-CODEGEN 标记时，允许覆盖不同内容。
  # 该选项会覆盖生成文件中的手工修改，不做增量合并；没有生成标记的不同内容仍会拒绝。
  # 正式重新生成已有代码：mode 改为 write，overwrite 改为 replace-generated，并先审查已有修改。
  # 仅查看覆盖后的预期产物：保留 dry-run，改为 replace-generated；不会实际覆盖代码。
  # 想先生成一份可查看的文件：复制本配置，将 backendRoot/frontendRoot 改到独立的 target 目录，
  # 再使用 write + fail；不要为了查看效果直接覆盖前后端项目中的现有代码。
  overwrite: "replace-generated"
  formatJava: true
  formatter: "scripts/format-java"
  # 批量预检全部完成后才发布，避免后面的表失败留下半套产物。
  # 报告 supported 表示表结构支持生成；rejected 中 <output> / OUTPUT_CONFLICT 表示输出冲突，
  # 不表示另外一张表不支持。FAILED_PREFLIGHT 时，本轮不会发布任何生成文件。
  publication: "preflight-all"
  unsupportedTable: "fail"

# 每表覆盖不是额外的生成选择；只有 selection 选中的表才会生成。
#tableOverrides:
#  pro_workorder:
#    module: "pro"
#    displayName: "生产工单"
#  person:
#    module: "business"
#    displayName: "人员"

# 本次六张业务表的同步匹配键；均明确选择本表的业务编码，不使用 ERP 编号覆盖 MES 自增主键。
tableOverrides:
  dv_subject:
    module: "dv"
    displayName: "设备点检保养项目"
    syncMatchKey: "subject_code"
  md_unit_measure:
    module: "md"
    displayName: "计量单位"
    syncMatchKey: "measure_code"
  md_workshop:
    module: "md"
    displayName: "车间"
    syncMatchKey: "workshop_code"
  pro_workorder:
    module: "pro"
    displayName: "生产工单"
    syncMatchKey: "workorder_code"
  qc_defect:
    module: "qc"
    displayName: "质量缺陷"
    syncMatchKey: "defect_code"
  qc_index:
    module: "qc"
    displayName: "质量检测项"
    syncMatchKey: "index_code"

  material_category:
    # 保留已审查的字段、引用选择和业务交互，页面变更由生成命令发布。
    frontendTemplate: "reviewed/materialCategory.vue.vm"
    serviceImplementationTemplate: "reviewed/MaterialCategoryServiceImpl.java.vm"
    controllerTemplate: "reviewed/MaterialCategoryController.java.vm"
    externalInputTemplate: "reviewed/ExternalMaterialCategory.java.vm"
    module: material
    displayName: 物料产品分类
    syncMatchKey: code
    serverScopeColumn: factory_id
  unit_measure:
    # 保留已审查的字段、引用选择和业务交互，页面变更由生成命令发布。
    frontendTemplate: "reviewed/unitMeasure.vue.vm"
    serviceImplementationTemplate: "reviewed/UnitMeasureServiceImpl.java.vm"
    controllerTemplate: "reviewed/UnitMeasureController.java.vm"
    externalInputTemplate: "reviewed/ExternalUnitMeasure.java.vm"
    module: material
    displayName: 计量单位
    syncMatchKey: code
    serverScopeColumn: factory_id
  workshop:
    # 保留已审查的字段、引用选择和业务交互，页面变更由生成命令发布。
    frontendTemplate: "reviewed/workshop.vue.vm"
    serviceImplementationTemplate: "reviewed/WorkshopServiceImpl.java.vm"
    controllerTemplate: "reviewed/WorkshopController.java.vm"
    externalInputTemplate: "reviewed/ExternalWorkshop.java.vm"
    module: material
    displayName: 车间
    syncMatchKey: code
    serverScopeColumn: factory_id
  workstation:
    # 保留已审查的字段、引用选择和业务交互，页面变更由生成命令发布。
    frontendTemplate: "reviewed/workstation.vue.vm"
    serviceImplementationTemplate: "reviewed/WorkstationServiceImpl.java.vm"
    controllerTemplate: "reviewed/WorkstationController.java.vm"
    externalInputTemplate: "reviewed/ExternalWorkstation.java.vm"
    module: material
    displayName: 工作站
    syncMatchKey: code
    serverScopeColumn: factory_id
  material:
    # 保留已审查的字段、引用选择和业务交互，页面变更由生成命令发布。
    frontendTemplate: "reviewed/material.vue.vm"
    serviceImplementationTemplate: "reviewed/MaterialServiceImpl.java.vm"
    controllerTemplate: "reviewed/MaterialController.java.vm"
    externalInputTemplate: "reviewed/ExternalMaterial.java.vm"
    # 保留既有非生成资源常量，内容一致时才允许发布，不能覆盖无标记文件。
    resourceTemplate: "reviewed/MaterialResource.java.vm"
    module: material
    displayName: 物料产品
    syncMatchKey: code
    serverScopeColumn: factory_id
  safety_stock:
    # 保留已审查的字段、引用选择和业务交互，页面变更由生成命令发布。
    frontendTemplate: "reviewed/safetyStock.vue.vm"
    serviceImplementationTemplate: "reviewed/SafetyStockServiceImpl.java.vm"
    controllerTemplate: "reviewed/SafetyStockController.java.vm"
    externalInputTemplate: "reviewed/ExternalSafetyStock.java.vm"
    module: material
    displayName: 安全库存配置
    syncMatchKey: material_id
    serverScopeColumn: factory_id
