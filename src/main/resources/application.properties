spring.application.name=mes-base
server.address=127.0.0.1
server.port=${MES_PORT:8080}
spring.web.resources.add-mappings=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.jackson.deserialization.fail-on-unknown-properties=true

# Developer Codegen profile; never a Factory/runtime binding. Empty URL means unavailable/unconfigured.
mes.codegen.default-datasource=${MES_CODEGEN_DEFAULT_DATASOURCE:dev}
mes.codegen.profiles.dev.url=${MES_CODEGEN_URL:}
mes.codegen.profiles.dev.username=${MES_CODEGEN_USER:}
mes.codegen.profiles.dev.password=${MES_CODEGEN_PASSWORD:}
mes.platform.enabled=${MES_PLATFORM_ENABLED:false}
mes.platform.url=${MES_PLATFORM_URL:}
mes.platform.username=${MES_PLATFORM_USER:}
mes.platform.password=${MES_PLATFORM_PASSWORD:}
mes.platform.migrate=${MES_PLATFORM_MIGRATE:false}
mes.platform.file-root=${MES_FILE_ROOT:}

# Multipart transport limit; FileService also bounds streamed bytes.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
